[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatid"
version = "0.1.1"
description = "Detect, validate and redact Indian identifiers (Aadhaar, PAN, GSTIN, IFSC, UPI, vehicle plates ...) with checksum validation. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashish Dhillon" }]
keywords = ["pii", "aadhaar", "pan", "gstin", "india", "redaction", "privacy", "llm"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.scripts]
bharatid = "bharatid.cli:main"
bharatid-hook = "bharatid.hook:main"

[project.urls]
Homepage = "https://github.com/ashishdhillon/bharatid"

[tool.setuptools]
packages = ["bharatid"]
